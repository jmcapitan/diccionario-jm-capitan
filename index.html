            --accent-blue: #1ba0e6;
            --text-main: #ecf0f1;
            --text-muted: #8a9ba8;
            --border-color: #1f3144;
            --row-hover: #182838;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            color: var(--accent-gold);
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .controls {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }
        }

        .search-box, .filter-box {
            position: relative;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 8px rgba(27, 160, 230, 0.3);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .badge {
            background: var(--accent-blue);
            color: #fff;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .table-container {
            max-height: 60vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        /* Personalización barra de desplazamiento */
        .table-container::-webkit-scrollbar {
            width: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        .table-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            position: sticky;
            top: 0;
            background: #0d1722;
            z-index: 10;
        }

        th {
            padding: 14px 16px;
            color: var(--accent-gold);
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        tbody tr:hover {
            background-color: var(--row-hover);
        }

        .col-id { width: 60px; text-align: center; color: var(--text-muted); }
        .col-term { width: 35%; color: var(--accent-blue); font-weight: 600; }
        .col-es { width: 35%; }
        .col-cat { width: 25%; color: var(--text-muted); font-size: 0.85rem; }

        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-style: italic;
        }

        .highlight {
            background-color: rgba(229, 169, 59, 0.3);
            color: #fff;
            padding: 1px 3px;
            border-radius: 2px;
        }
    </style>
</head>

const searchInput = document.getElementById('searchInput');
const categoryFilter = document.getElementById('categoryFilter');
const dictionaryBody = document.getElementById('dictionaryBody');
const matchCount = document.getElementById('matchCount');
const noResults = document.getElementById('noResults');

function renderTable(data, query = "") {
    dictionaryBody.innerHTML = "";
    
    if (data.length === 0) {
        noResults.style.display = "block";
        matchCount.textContent = "0";
        return;
    }

    noResults.style.display = "none";
    matchCount.textContent = data.length;

    data.forEach(item => {
        const row = document.createElement('tr');
        
        let termHTML = highlightText(item.term, query);
        let esHTML = highlightText(item.es, query);

        row.innerHTML = `
            <td class="col-id">${item.id}</td>
            <td class="col-term">${termHTML}</td>
            <td class="col-es">${esHTML}</td>
            <td class="col-cat">${item.cat}</td>
        `;
        dictionaryBody.appendChild(row);
    });
}

function highlightText(text, query) {
    if (!query) return text;
    const regex = new RegExp(`(${escapeRegExp(query)})`, 'gi');
    return text.replace(regex, '<span class="highlight">$1</span>');
}

function escapeRegExp(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function filterData() {
    const query = searchInput.value.toLowerCase().trim();
    const selectedCategory = categoryFilter.value;

    const filtered = dictionary.filter(item => {
        const matchesCategory = selectedCategory === "ALL" || item.cat === selectedCategory;
        const matchesQuery = item.term.toLowerCase().includes(query) || 
                             item.es.toLowerCase().includes(query) ||
                             item.id.toString() === query;
        return matchesCategory && matchesQuery;
    });

    renderTable(filtered, query);
}

// Event Listeners
searchInput.addEventListener('input', filterData);
categoryFilter.addEventListener('change', filterData);

document.addEventListener('keydown', (e) => {
    if (e.key === "Escape") {
        searchInput.value = "";
        filterData();
        searchInput.focus();
    }
});

// Inicialización
renderTable(dictionary);
</script>
